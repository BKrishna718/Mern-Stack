<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

</head>
<body>

    <form>
        <label for="name">Name:</label>
        <input type="text" id="name" name="name" onkeydown="eventActivated()" onkeyup="eventActivated()" onkeypress="eventActivated()">
        <br><br>
        <label for="email">Email:</label>
        <input type="email" id="email" name="email" onkeydown="eventActivated()" onkeyup="eventActivated()" onkeypress="eventActivated()">
        <br><br>
        <label for="password">Password:</label>
        <input type="password" id="password" name="password" onkeydown="eventActivated()" onkeyup="eventActivated()" onkeypress="eventActivated()">
        <br><br>
        <button type="submit">Submit</button>
    </form>


</body>
